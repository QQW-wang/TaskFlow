services:
  db:
    image: postgres:16-alpine
    container_name: taskflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
      POSTGRES_DB: taskflow
    # 如果本机 5432 端口已被占用，可以设置 POSTGRES_PORT=5433 后再启动，
    # 同时把 .env 的 DATABASE_URL 端口改成 5433。
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - taskflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  taskflow_pgdata: